[project]
name = "foodfenbe"
version = "0.1.0"
description = "FoodFen backend service (Clean Architecture / FastAPI / async SQLAlchemy)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "alembic>=1.13",
    "pyjwt[crypto]>=2.9",  # [crypto] pulls in `cryptography`, required for RS256 (social sign-in)
    "bcrypt>=4.2",
    "python-multipart>=0.0.12",  # required by OAuth2PasswordRequestForm (Swagger login)
    "google-genai>=1.0",
    "cloudinary>=1.41",
    "payos>=1.1.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "import-linter>=2.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.22.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# One event loop for the whole run. The engine in src/infrastructure/db/session.py
# is module-level, so its pooled connections bind to the loop that first used them;
# a fresh loop per test makes them stale ("Event loop is closed"). Production runs
# a single loop for the process lifetime, so this matches it.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

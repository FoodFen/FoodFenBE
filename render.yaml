services:
  - type: web
    name: foodfenbe
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free # sleeps after ~15 min idle: the first request (or payment IPN) after that waits for a cold start
    envVars:
      - key: DATABASE_URL
        sync: false # postgresql+asyncpg://... — e.g. a Neon free Postgres connection string
      - key: JWT_SECRET
        generateValue: true
      - key: APP_BASE_URL
        sync: false # the web client (FoodFenWeb) origin: email links land on its /auth/* pages
      - key: CORS_ALLOW_ORIGINS
        value: "*"
      # Optional, only needed if the client exercises that feature — add in the
      # Render dashboard, they fail closed (not open) when unset:
      # GEMINI_API_KEY, GOOGLE_OAUTH_CLIENT_IDS, APPLE_CLIENT_IDS, CLOUDINARY_URL,
      # PAYOS_CLIENT_ID, PAYOS_API_KEY, PAYOS_CHECKSUM_KEY, PAYOS_RETURN_URL, PAYOS_CANCEL_URL
      # MOMO_PARTNER_CODE, MOMO_ACCESS_KEY, MOMO_SECRET_KEY, MOMO_REDIRECT_URL,
      # MOMO_ENDPOINT (https://payment.momo.vn for prod; defaults to the sandbox),
      # MOMO_IPN_URL (https://<service>.onrender.com/payments/webhook/momo)
      # First admin account (created at startup if missing): ADMIN_EMAIL, ADMIN_PASSWORD
      # Real email instead of logging links: EMAIL_BACKEND=brevo plus
      # BREVO_API_KEY and EMAIL_FROM (a sender address or domain verified in Brevo)
      # SEED_DEMO adds fictional restaurants: leave it unset (false) in production

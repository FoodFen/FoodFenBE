name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - run: uv sync --frozen
      - run: uv run lint-imports
      # tests/conftest.py runs them on in-memory SQLite: no database service needed.
      - run: uv run pytest

  # Render builds the image from the repo's Dockerfile itself, so CI no longer builds or pushes one.
  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          out=$(curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL")
          echo "$out"
          # Must be the service's Deploy Hook (Render > foodfenbe > Settings). A Blueprint sync
          # hook answers "sync started", goes green, and deploys nothing.
          if echo "$out" | grep -qi blueprint; then
            echo "::error::RENDER_DEPLOY_HOOK_URL is a Blueprint sync hook, not the service Deploy Hook"
            exit 1
          fi
